<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Proxy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #1a1a2e; color: white; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: #16213e; padding: 15px; text-align: center; border-bottom: 2px solid #e94560; }
        .container { flex: 1; padding: 15px; max-width: 600px; margin: 0 auto; width: 100%; }
        .url-box { display: flex; gap: 8px; margin-bottom: 15px; }
        #urlInput { flex: 1; padding: 12px; border: 2px solid #0f3460; border-radius: 10px; background: #16213e; color: white; font-size: 14px; }
        .btn { padding: 12px 20px; background: #e94560; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .quick-btns { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .quick-btn { background: #0f3460; padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; border: none; color: white; }
        #resultFrame { width: 100%; height: 400px; border: 2px solid #0f3460; border-radius: 10px; background: white; }
        .status { text-align: center; padding: 10px; font-size: 13px; opacity: 0.7; }
        .loading-text { text-align: center; padding: 15px; display: none; }
        .loading-text.show { display: block; }
    </style>
</head>
<body>
    <div class="header"><h2>🚀 Google Proxy</h2></div>
    <div class="container">
        <div class="url-box">
            <input type="text" id="urlInput" placeholder="آدرس سایت را وارد کنید..." value="https://api.ipify.org?format=json">
            <button class="btn" onclick="loadURL()">برو!</button>
        </div>
        <div class="quick-btns">
            <button class="quick-btn" onclick="quickLoad('https://api.ipify.org?format=json')">IP من</button>
            <button class="quick-btn" onclick="quickLoad('https://www.google.com')">Google</button>
            <button class="quick-btn" onclick="quickLoad('https://youtube.com')">YouTube</button>
            <button class="quick-btn" onclick="quickLoad('https://github.com')">GitHub</button>
        </div>
        <div class="loading-text" id="loading">⏳ در حال بارگذاری...</div>
        <iframe id="resultFrame"></iframe>
        <div class="status" id="status">✨ آماده</div>
    </div>
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';
        async function loadURL() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            const fullURL = url.startsWith('http') ? url : 'https://' + url;
            document.getElementById('urlInput').value = fullURL;
            document.getElementById('loading').classList.add('show');
            document.getElementById('status').textContent = '⏳ در حال اتصال...';
            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ targetUrl: fullURL, method: 'GET' }) });
                const data = await response.json();
                const iframe = document.getElementById('resultFrame');
                iframe.srcdoc = typeof data === 'string' ? data : data.content || data.body || JSON.stringify(data, null, 2);
                document.getElementById('status').textContent = '✅ با موفقیت بارگذاری شد';
            } catch (error) {
                document.getElementById('status').textContent = '❌ خطا: ' + error.message;
                document.getElementById('resultFrame').srcdoc = '<div style="padding:20px;color:red;"><h3>❌ خطا</h3><p>' + error.message + '</p></div>';
            } finally { document.getElementById('loading').classList.remove('show'); }
        }
        function quickLoad(url) { document.getElementById('urlInput').value = url; loadURL(); }
        document.getElementById('urlInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') loadURL(); });
    </script>
</body>
</html>
